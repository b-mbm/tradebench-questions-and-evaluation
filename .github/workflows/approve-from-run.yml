name: Approve From Run (Auto-download)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions run_id to source the artifact from"
        required: true
      artifact_contains:
        description: "Artifact name substring to match"
        required: false
        default: "results"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Download artifact and approve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx tsx scripts/approve-from-run.ts --run-id "${{ github.event.inputs.run_id }}" --artifact-contains "${{ github.event.inputs.artifact_contains }}"
      - name: Commit and push
        run: |
          if git status --porcelain | grep .; then
            git config user.name "tradebench-bot"
            git config user.email "actions@users.noreply.github.com"
            git add results/official results/official-manifest.json
            git commit -m "chore: approve from run ${{ github.event.inputs.run_id }}"
            git push
          else
            echo "No changes to commit."
          fi
      - name: Combine official after approval
        run: |
          npx tsx scripts/combine-from-manifest.ts results/official-manifest.json --out results/official-combined.json --label official
          npx tsx scripts/report-combined.ts results/official-combined.json
      - name: Upload official combined
        uses: actions/upload-artifact@v4
        with:
          name: official-combined
          path: results/official-combined.json

