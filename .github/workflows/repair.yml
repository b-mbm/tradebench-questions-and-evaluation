name: Repair and Merge

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: "Model ID for repair run"
        required: true
      ids:
        description: "Comma-separated question IDs to repair"
        required: true
      base_file:
        description: "Path to base JSON (will be updated in-place)"
        required: true
      label:
        description: "Label/prefix for repair run"
        required: false
        default: "60q-repair"
      call_spacing_ms:
        description: "Per-question spacing (ms)"
        required: false
        default: "600"
      retry_attempts:
        description: "Retry attempts"
        required: false
        default: "3"
      retry_base_delay_ms:
        description: "Retry base delay (ms)"
        required: false
        default: "700"

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Run repair and auto-merge
        env:
          NODE_OPTIONS: -r dotenv/config
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL_IDS: ${{ github.event.inputs.model_id }}
          CALL_SPACING_MS: ${{ github.event.inputs.call_spacing_ms }}
          RETRY_ATTEMPTS: ${{ github.event.inputs.retry_attempts }}
          RETRY_BASE_DELAY_MS: ${{ github.event.inputs.retry_base_delay_ms }}
          MERGE_INTO_BASE: ${{ github.event.inputs.base_file }}
        run: |
          mkdir -p results
          npx tsx scripts/run-60q.ts --ids "${{ github.event.inputs.ids }}" --label "${{ github.event.inputs.label }}" --file-prefix "${{ github.event.inputs.label }}"
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: repair-${{ github.event.inputs.label }}
          path: results/*.json

